<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLYNT Widget Review</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #111111;
      --surface: #171717;
      --item: #222222;
      --raised: #282828;
      --divider: #353532;
      --text: #f7f6f2;
      --muted: #aaa89f;
      --positive: #67c587;
      --negative: #ff6961;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at 14% 8%, rgba(66, 96, 111, 0.30), transparent 34%),
        radial-gradient(circle at 88% 34%, rgba(74, 94, 78, 0.24), transparent 36%),
        var(--page);
    }

    button, select, textarea, input { font: inherit; }

    button, select {
      min-height: 44px;
      border: 1px solid var(--divider);
      border-radius: 999px;
      background: var(--item);
      color: var(--text);
      padding: 0 16px;
    }

    button { cursor: pointer; }
    button:hover { background: var(--raised); }
    button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 3px solid rgba(247, 246, 242, 0.42);
      outline-offset: 2px;
    }

    .review-shell {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    .review-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 7px 0 5px;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle { margin: 0; color: var(--muted); }

    .review-progress {
      min-width: 180px;
      text-align: right;
    }

    .review-progress strong {
      display: block;
      font-size: 26px;
      font-variant-numeric: tabular-nums;
    }

    .review-progress span { color: var(--muted); font-size: 13px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 14px;
      border: 1px solid rgba(247, 246, 242, 0.12);
      border-radius: 24px;
      background: rgba(23, 23, 23, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 18px 48px rgba(0, 0, 0, 0.18);
      -webkit-backdrop-filter: blur(26px) saturate(125%);
      backdrop-filter: blur(26px) saturate(125%);
    }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }

    .tab[aria-selected="true"] {
      background: var(--text);
      color: #0b0b0b;
      border-color: var(--text);
    }

    .filters {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      padding-top: 4px;
    }

    .toolbar-actions button:first-child {
      background: var(--text);
      color: #0b0b0b;
      border-color: var(--text);
    }

    .review-list {
      display: grid;
      gap: 22px;
      padding-top: 22px;
    }

    .review-item {
      background: rgba(23, 23, 23, 0.74);
      border: 1px solid rgba(247, 246, 242, 0.12);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.055), 0 22px 60px rgba(0, 0, 0, 0.20);
      -webkit-backdrop-filter: blur(28px) saturate(122%);
      backdrop-filter: blur(28px) saturate(122%);
    }

    .item-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--divider);
    }

    .item-title { min-width: 0; }
    .item-title strong { display: block; font-size: 17px; }
    .item-title span { color: var(--muted); font-size: 12px; }

    .approval-control {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 13px;
      border: 1px solid var(--divider);
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
    }

    .approval-control input {
      appearance: none;
      width: 22px;
      height: 22px;
      margin: 0;
      border: 1.5px solid var(--muted);
      border-radius: 50%;
      background: transparent;
      display: grid;
      place-items: center;
    }

    .approval-control input::after {
      content: "✓";
      color: #0b0b0b;
      font-size: 15px;
      font-weight: 800;
      transform: scale(0);
    }

    .approval-control input:checked {
      background: var(--positive);
      border-color: var(--positive);
    }

    .approval-control input:checked::after { transform: scale(1); }

    .comparison-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .comparison-pane { min-width: 0; padding: 16px; }
    .comparison-pane + .comparison-pane { border-left: 1px solid var(--divider); }

    .pane-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .pane-label span:last-child { letter-spacing: 0; }

    .render-stage {
      min-height: 220px;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      border-radius: 18px;
      background: #0b0b0b;
    }

    .goal-mount {
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 170px;
    }

    .goal-mount > * { flex: 0 0 auto !important; }

    .current-image {
      display: block;
      width: min(100%, 620px);
      height: auto;
    }

    .pending-current {
      width: min(100%, 520px);
      min-height: 170px;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 1px dashed var(--divider);
      border-radius: 24px;
      color: var(--muted);
      text-align: center;
    }

    .review-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
      border-top: 1px solid var(--divider);
    }

    .review-fields label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      border: 1px solid var(--divider);
      border-radius: 14px;
      background: var(--item);
      color: var(--text);
      padding: 12px;
      line-height: 1.4;
      text-transform: none;
      letter-spacing: 0;
    }

    .empty-filter {
      padding: 48px 20px;
      color: var(--muted);
      text-align: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 11px 16px;
      border-radius: 999px;
      background: var(--text);
      color: #0b0b0b;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .toast.visible { opacity: 1; }

    @media (max-width: 820px) {
      .review-header { align-items: flex-start; }
      .review-progress { min-width: 120px; }
      .filters { margin-left: 0; width: 100%; }
      .comparison-grid, .review-fields { grid-template-columns: 1fr; }
      .comparison-pane + .comparison-pane { border-left: 0; border-top: 1px solid var(--divider); }
    }

    @media (max-width: 520px) {
      .review-shell { width: min(100% - 18px, 1500px); padding-top: 18px; }
      .review-header { display: grid; }
      .review-progress { text-align: left; }
      .render-stage { padding: 12px; min-height: 190px; }
      .item-header { align-items: flex-start; flex-wrap: wrap; }
      .approval-control { margin-left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast { transition: none; }
    }

    @media (prefers-reduced-transparency: reduce) {
      body::before { background: var(--page); }
      .toolbar, .review-item {
        background: var(--surface);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="review-shell">
    <header class="review-header">
      <div>
        <div class="eyebrow">FLYNT design review</div>
        <h1>Widget comparison board</h1>
        <p class="subtitle">Goal beside current · notes and approvals save automatically in this browser.</p>
      </div>
      <div class="review-progress" aria-live="polite">
        <strong id="approved-count">0 / 0</strong>
        <span>approved</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Review controls">
      <div class="tabs" role="tablist" aria-label="Review category">
        <button class="tab" type="button" role="tab" data-tab="home" aria-selected="true">Home widgets</button>
        <button class="tab" type="button" role="tab" data-tab="states" aria-selected="false">State variations</button>
        <button class="tab" type="button" role="tab" data-tab="lock" aria-selected="false">Lock Screen</button>
      </div>
      <div class="filters" id="home-filters">
        <label>
          <span class="sr-only">Family</span>
          <select id="family-filter" aria-label="Filter widget family">
            <option value="all">All families</option>
            <option value="today">Today</option>
            <option value="next-set">Next Set</option>
            <option value="week">Week</option>
          </select>
        </label>
        <label>
          <span class="sr-only">Size</span>
          <select id="size-filter" aria-label="Filter widget size">
            <option value="all">All sizes</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </label>
        <label>
          <span class="sr-only">Appearance</span>
          <select id="appearance-filter" aria-label="Filter appearance">
            <option value="all">Light and dark</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>
      <div class="toolbar-actions">
        <button type="button" id="copy-review">Copy feedback brief</button>
        <button type="button" id="download-review">Download review JSON</button>
      </div>
    </section>

    <section class="review-list" id="review-list" aria-live="polite"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const storageKey = "flynt-widget-review-v1";
    const familyLabels = { today: "Today", "next-set": "Next Set", week: "Week" };
    const sectionIds = { today: "1a", "next-set": "1b", week: "1c" };
    const dimensions = {
      small: { width: 170, height: 170 },
      medium: { width: 364, height: 170 },
      large: { width: 364, height: 382 }
    };
    const currentNativeCaptures = new Set([
      "today-small-light",
      "today-small-dark",
      "today-medium-light",
      "today-medium-dark",
      "today-large-light",
      "today-large-dark"
    ]);

    const homeItems = [];
    for (const family of ["today", "next-set", "week"]) {
      for (const size of ["small", "medium", "large"]) {
        for (const appearance of ["light", "dark"]) {
          const captureKey = `${family}-${size}-${appearance}`;
          const hasCurrentCapture = currentNativeCaptures.has(captureKey);
          homeItems.push({
            id: `home-${family}-${size}-${appearance}`,
            category: "home",
            family,
            size,
            appearance,
            title: `${familyLabels[family]} · ${size[0].toUpperCase() + size.slice(1)} · ${appearance[0].toUpperCase() + appearance.slice(1)}`,
            goalImage: `widget-review-assets/goal-${family}-${size}-${appearance}.png`,
            currentImage: hasCurrentCapture
              ? `widget-review-assets/current-${captureKey}.png`
              : null,
            currentStatus: hasCurrentCapture
              ? "Existing native Simulator capture"
              : "Current native capture missing"
          });
        }
      }
    }

    const stateNames = [
      "Rest day",
      "In progress",
      "Completed today",
      "No plan yet",
      "Plan building",
      "Stale data",
      "Signed out"
    ];

    const stateItems = stateNames.map((title, index) => ({
      id: `state-${title.toLowerCase().replaceAll(" ", "-")}`,
      category: "states",
      title,
      stateIndex: index,
      goalImage: `widget-review-assets/goal-state-${title.toLowerCase().replaceAll(" ", "-")}.png`,
      currentStatus: "Current native state capture pending"
    }));

    const lockItems = [
      { id: "lock-accessory-circular", category: "lock", title: "Accessory circular", goalImage: "widget-review-assets/goal-lock-accessory-circular.png", currentStatus: "Not implemented" },
      { id: "lock-accessory-rectangular", category: "lock", title: "Accessory rectangular", goalImage: "widget-review-assets/goal-lock-accessory-rectangular.png", currentStatus: "Not implemented" },
      { id: "lock-accessory-inline", category: "lock", title: "Accessory inline", goalImage: "widget-review-assets/goal-lock-accessory-inline.png", currentStatus: "Not implemented" },
      { id: "lock-island-compact", category: "lock", title: "Dynamic Island compact", goalImage: "widget-review-assets/goal-lock-island-compact.png", currentStatus: "Not implemented" },
      { id: "lock-island-expanded", category: "lock", title: "Dynamic Island expanded", goalImage: "widget-review-assets/goal-lock-island-expanded.png", currentStatus: "Not implemented" },
      { id: "lock-live-activity", category: "lock", title: "Lock Screen Live Activity", goalImage: "widget-review-assets/goal-lock-live-activity.png", currentStatus: "Not implemented" }
    ];

    const allItems = [...homeItems, ...stateItems, ...lockItems];
    const reviewList = document.getElementById("review-list");
    const approvedCount = document.getElementById("approved-count");
    const familyFilter = document.getElementById("family-filter");
    const sizeFilter = document.getElementById("size-filter");
    const appearanceFilter = document.getElementById("appearance-filter");
    const homeFilters = document.getElementById("home-filters");
    const toast = document.getElementById("toast");

    let activeTab = "home";
    let reviewState = loadReviewState();

    function loadReviewState() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || {};
      } catch {
        return {};
      }
    }

    function saveReviewState() {
      localStorage.setItem(storageKey, JSON.stringify(reviewState));
      updateApprovedCount();
    }

    function itemState(id) {
      return reviewState[id] || { approved: false, good: "", changes: "" };
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function visibleItems() {
      return allItems.filter(item => {
        if (item.category !== activeTab) return false;
        if (activeTab !== "home") return true;
        if (familyFilter.value !== "all" && item.family !== familyFilter.value) return false;
        if (sizeFilter.value !== "all" && item.size !== sizeFilter.value) return false;
        if (appearanceFilter.value !== "all" && item.appearance !== appearanceFilter.value) return false;
        return true;
      });
    }

    function updateApprovedCount() {
      const relevant = allItems.filter(item => item.category === activeTab);
      const approved = relevant.filter(item => itemState(item.id).approved).length;
      approvedCount.textContent = `${approved} / ${relevant.length}`;
    }

    function render() {
      const items = visibleItems();
      reviewList.innerHTML = items.length ? items.map(itemMarkup).join("") : '<div class="empty-filter">No review items match these filters.</div>';
      bindReviewInputs();
      updateApprovedCount();
    }

    function itemMarkup(item) {
      const state = itemState(item.id);
      const metadata = item.category === "home"
        ? `${item.size} · ${item.appearance}`
        : item.category === "lock" ? "Lock Screen goal" : "Lifecycle state";
      const current = item.currentImage
        ? `<img class="current-image" src="${item.currentImage}" alt="Current native ${escapeHtml(item.title)} render">`
        : `<div class="pending-current"><div><strong>${escapeHtml(item.currentStatus)}</strong><br><span>Goal remains available for review and approval notes.</span></div></div>`;

      return `
        <article class="review-item" data-item-id="${item.id}">
          <header class="item-header">
            <div class="item-title">
              <strong>${escapeHtml(item.title)}</strong>
              <span>${escapeHtml(metadata)}</span>
            </div>
            <label class="approval-control">
              <input type="checkbox" data-field="approved" ${state.approved ? "checked" : ""}>
              <span>Approve this target</span>
            </label>
          </header>
          <div class="comparison-grid">
            <section class="comparison-pane" aria-label="Goal design">
              <div class="pane-label"><span>Goal</span><span>Claude handoff</span></div>
              <div class="render-stage"><img class="current-image" src="${item.goalImage}" alt="Approved ${escapeHtml(item.title)} target"></div>
            </section>
            <section class="comparison-pane" aria-label="Current implementation">
              <div class="pane-label"><span>Current</span><span>${escapeHtml(item.currentStatus)}</span></div>
              <div class="render-stage">${current}</div>
            </section>
          </div>
          <div class="review-fields">
            <label>What is good
              <textarea data-field="good" placeholder="Keep these parts exactly…">${escapeHtml(state.good)}</textarea>
            </label>
            <label>Changes wanted
              <textarea data-field="changes" placeholder="Describe what should change…">${escapeHtml(state.changes)}</textarea>
            </label>
          </div>
        </article>`;
    }

    function bindReviewInputs() {
      for (const article of reviewList.querySelectorAll("[data-item-id]")) {
        const id = article.dataset.itemId;
        for (const input of article.querySelectorAll("[data-field]")) {
          input.addEventListener("input", () => {
            const next = { ...itemState(id) };
            next[input.dataset.field] = input.type === "checkbox" ? input.checked : input.value;
            reviewState[id] = next;
            saveReviewState();
          });
        }
      }
    }

    function reviewPayload() {
      return {
        generatedAt: new Date().toISOString(),
        source: "FLYNT widget comparison board",
        items: allItems.map(item => ({
          id: item.id,
          title: item.title,
          category: item.category,
          currentStatus: item.currentStatus,
          ...itemState(item.id)
        }))
      };
    }

    function feedbackBrief() {
      const reviewed = reviewPayload().items.filter(item => item.approved || item.good.trim() || item.changes.trim());
      if (!reviewed.length) return "No FLYNT widget feedback has been entered yet.";
      return reviewed.map(item => {
        const lines = [`${item.approved ? "APPROVED" : "REVIEW"}: ${item.title}`];
        if (item.good.trim()) lines.push(`Good: ${item.good.trim()}`);
        if (item.changes.trim()) lines.push(`Change: ${item.changes.trim()}`);
        return lines.join("\n");
      }).join("\n\n");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("visible");
      window.setTimeout(() => toast.classList.remove("visible"), 1800);
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        activeTab = tab.dataset.tab;
        document.querySelectorAll(".tab").forEach(candidate => candidate.setAttribute("aria-selected", String(candidate === tab)));
        homeFilters.hidden = activeTab !== "home";
        render();
      });
    });

    [familyFilter, sizeFilter, appearanceFilter].forEach(filter => filter.addEventListener("change", render));

    document.getElementById("copy-review").addEventListener("click", async () => {
      const brief = feedbackBrief();
      await navigator.clipboard.writeText(brief);
      showToast("Feedback brief copied");
    });

    document.getElementById("download-review").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(reviewPayload(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "flynt-widget-review.json";
      link.click();
      URL.revokeObjectURL(url);
      showToast("Review JSON downloaded");
    });

    render();
  </script>
</body>
</html>
